<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Collections | Mathan Kumar P</title>
  <meta name="description" content="Tools, repositories, videos, books and news shared by Mathan Kumar P.">
  <meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0F14" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231e7eae'/%3E%3Ctext x='16' y='22' font-size='15' font-family='Arial' font-weight='700' text-anchor='middle' fill='white'%3EMK%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    /* Palette: #0A0F14 ink, #0F3D3E deep teal, #2E6F73 teal, #7FB3B8 mist, #EADCC8 sand, #C6601F ember.
       Defaults only. data.json > settings.themeColors overrides them at runtime. */
    :root {
      --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
      --gradient-from: #2E6F73; --gradient-to: #0F3D3E; --accent: #C6601F; --on-primary: #FFFFFF;
      --bg-page: #F6F1E8; --bg-card: #FCFAF6; --bg-sidebar: #FCFAF6;
      --text-main: #0A0F14; --text-muted: #4A5D60; --border-color: #E2D6C2;
      --color-primary-50: color-mix(in srgb, #2E6F73 9%, transparent); --color-primary-600: #276064; --color-primary-800: #1D4649;
    }
    .dark {
      --gradient-from: #2E6F73; --gradient-to: #0F3D3E; --accent: #C6601F; --on-primary: #0A0F14;
      --bg-page: #0A0F14; --bg-card: #0F1A1F; --bg-sidebar: #0C1519;
      --text-main: #EADCC8; --text-muted: #94ADB0; --border-color: #1E3A3D;
      --color-primary-50: color-mix(in srgb, #7FB3B8 13%, transparent); --color-primary-600: #7FB3B8; --color-primary-800: #EADCC8;
    }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg-page); color: var(--text-main); margin: 0; -webkit-font-smoothing: antialiased; }
    h1, h3, #miniName, #mName { font-family: var(--serif); letter-spacing: -0.005em; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); }
    .sidebar { background: var(--bg-sidebar); border-right: 1px solid var(--border-color); }
    .side-link { color: var(--text-muted); border-radius: 0.75rem; }
    .side-link:hover { background: var(--color-primary-50); color: var(--color-primary-600); }
    .filter-chip:hover:not(.active) { border-color: var(--color-primary-600); color: var(--color-primary-600); background: var(--color-primary-50); }
    .thumb-card:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--border-color)) !important; box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--accent) 45%, transparent) !important; }
    .side-link.active { background: linear-gradient(135deg, var(--gradient-from), var(--gradient-to)); color: #EADCC8; }
    .filter-chip { border: 1px solid var(--border-color); color: var(--text-muted); background: var(--bg-card); border-radius: 9999px; font-size: 0.8rem; }
    .filter-chip.active { background: linear-gradient(135deg, var(--gradient-from), var(--gradient-to)); color: #EADCC8; border-color: transparent; }
    .cat-badge { font-size: 0.72rem; padding: 0.15rem 0.5rem; border-radius: 9999px; font-weight: 500; background: var(--color-primary-50); color: var(--color-primary-800); }
    #loader { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: var(--bg-page); }
    .thumb-card { transition: .15s ease; }
    .thumb-card:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -8px rgba(0,0,0,.15); }
    #backToTop {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 40;
      width: 2.75rem; height: 2.75rem; border-radius: 9999px;
      display: none; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--gradient-from), var(--gradient-to));
      color: #EADCC8; box-shadow: 0 8px 20px -6px rgba(0,0,0,.35); cursor: pointer;
    }
    #backToTop.show { display: flex; }

    /* Desktop: sidebar visible */
    .desktop-sidebar { display: flex; }
    .mobile-topbar { display: none; }

    /* Mobile drawer */
    #catDrawerOverlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50;
    }
    #catDrawerOverlay.open { display: block; }
    #catDrawer {
      position: fixed; top: 0; left: 0; bottom: 0; width: min(18rem, 85vw);
      background: var(--bg-sidebar); z-index: 55;
      transform: translateX(-105%); transition: transform .25s ease;
      display: flex; flex-direction: column;
      box-shadow: 4px 0 24px rgba(0,0,0,.15);
    }
    #catDrawer.open { transform: translateX(0); }

    /* --- audit fixes --- */
    :focus-visible { outline: 2px solid var(--color-primary-600); outline-offset: 2px; border-radius: 6px; }
    .side-link:focus-visible, .filter-chip:focus-visible { outline-offset: -2px; }
    .filter-chip { min-height: 36px; }
    #loader { transition: opacity 0.3s ease; }
    #catDrawer[inert] { visibility: hidden; }
    @media (max-width: 420px) {
      #mPhoto, #mInitials { display: none !important; }
      .mobile-topbar > div { gap: 0.5rem !important; padding-left: 0.75rem !important; padding-right: 0.75rem !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      html { scroll-behavior: auto !important; }
    }
    @media (max-width: 768px) {
      .desktop-sidebar { display: none !important; }
      .mobile-topbar { display: block !important; }
      .layout { flex-direction: column !important; }
      .main-content { width: 100% !important; }
    }
  </style>
</head>
<body class="min-h-screen">
  <div id="loader">
    <div class="text-center">
      <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-3"></div>
      <p style="color:var(--text-muted)">Loading…</p>
    </div>
  </div>

  <!-- MOBILE TOP BAR (profile + Category button) -->
  <div class="mobile-topbar sticky top-0 z-30 border-b" style="background: var(--bg-card); border-color: var(--border-color)">
    <div class="px-4 py-3 flex items-center gap-3">
      <a href="index.html" class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="border: 1px solid var(--border-color); color: var(--color-primary-600)" title="Back to profile" aria-label="Back to profile">
        <i class="fas fa-arrow-left text-sm"></i>
      </a>
      <img id="mPhoto" src="" alt="" width="40" height="40" class="w-10 h-10 rounded-xl object-cover border hidden flex-shrink-0" style="border-color: var(--border-color)">
      <div id="mInitials" class="w-10 h-10 rounded-xl flex items-center justify-center text-xs font-bold flex-shrink-0" style="background: linear-gradient(135deg, var(--gradient-from), var(--gradient-to)); color: #EADCC8"></div>
      <div class="min-w-0 flex-1">
        <p id="mName" class="font-semibold text-sm truncate" style="color: var(--text-main)"></p>
        <p id="mCatLabel" class="text-[11px] truncate" style="color: var(--text-muted)">All collections</p>
      </div>
      <a id="suggestBtnMobile" href="mailto:mathankumar.sh@psgitech.ac.in?subject=Collection%20suggestion%20for%20portfolio" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-semibold flex-shrink-0" style="color: var(--color-primary-600); border: 1px solid var(--border-color)" aria-label="Suggest a collection item" title="Suggest a collection item">
        <i class="fas fa-lightbulb"></i>
      </a>
      <button type="button" onclick="openCatDrawer()" aria-controls="catDrawer" aria-expanded="false" id="catBtn" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold flex-shrink-0" style="background: linear-gradient(135deg, var(--gradient-from), var(--gradient-to)); color: #EADCC8">
        <i class="fas fa-layer-group"></i> Categories
      </button>
      <button type="button" onclick="toggleTheme()" class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style="color: var(--text-muted); border: 1px solid var(--border-color)" aria-label="Toggle light and dark theme">
        <i class="fas fa-moon dark:hidden"></i>
        <i class="fas fa-sun hidden dark:inline"></i>
      </button>
    </div>
  </div>

  <!-- MOBILE CATEGORY DRAWER -->
  <div id="catDrawerOverlay" onclick="closeCatDrawer()"></div>
  <div id="catDrawer" role="dialog" aria-modal="true" aria-label="Categories" aria-hidden="true" inert>
    <div class="p-4 border-b flex items-center justify-between" style="border-color: var(--border-color)">
      <span class="font-semibold text-sm" style="color: var(--text-main)">Categories</span>
      <button type="button" onclick="closeCatDrawer()" class="w-10 h-10 rounded-full flex items-center justify-center" style="color: var(--text-muted)" aria-label="Close categories"><i class="fas fa-times" aria-hidden="true"></i></button>
    </div>
    <nav id="drawerNav" class="p-3 flex flex-col gap-1 overflow-y-auto flex-1"></nav>
  </div>

  <div class="layout flex min-h-screen">
    <!-- DESKTOP SIDEBAR -->
    <aside class="desktop-sidebar sidebar w-72 flex-shrink-0 sticky top-0 overflow-y-auto flex-col" style="height:100vh;height:100dvh">
      <div class="p-4 border-b" style="border-color: var(--border-color)">
        <div class="flex items-center justify-between gap-2 mb-4">
          <a href="index.html" class="inline-flex items-center gap-2 text-sm font-medium px-3 py-1.5 rounded-xl" style="color: var(--color-primary-600); border: 1px solid var(--border-color)">
            <i class="fas fa-arrow-left text-xs"></i> Back to profile
          </a>
          <button type="button" onclick="toggleTheme()" class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style="color: var(--text-muted); border: 1px solid var(--border-color)" title="Toggle theme" aria-label="Toggle light and dark theme">
            <i class="fas fa-moon dark:hidden"></i>
            <i class="fas fa-sun hidden dark:inline"></i>
          </button>
        </div>
        <div class="flex items-center gap-3">
          <img id="miniPhoto" src="" alt="" width="48" height="48" class="w-12 h-12 rounded-xl object-cover border hidden flex-shrink-0" style="border-color: var(--border-color)">
          <div id="miniInitials" class="w-12 h-12 rounded-xl flex items-center justify-center text-sm font-bold flex-shrink-0" style="background: linear-gradient(135deg, var(--gradient-from), var(--gradient-to)); color: #EADCC8"></div>
          <div class="min-w-0">
            <p id="miniName" class="font-semibold text-sm truncate" style="color: var(--text-main)"></p>
            <p id="miniTitle" class="text-xs truncate" style="color: var(--text-muted)"></p>
          </div>
        </div>
      </div>
      <nav id="sideNav" class="p-3 flex flex-col gap-1 flex-1"></nav>
    </aside>

    <!-- CONTENT -->
    <main class="main-content flex-1 min-w-0 p-4 sm:p-6">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div>
          <h1 id="pageTitle" class="text-xl sm:text-2xl font-bold" style="color: var(--text-main)">All collections</h1>
          <p id="pageSubtitle" class="text-sm mt-0.5" style="color: var(--text-muted)">Browse everything in one place</p>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
          <span id="itemCount" aria-live="polite" class="text-xs px-2 py-1 rounded-full" style="background: var(--color-primary-50); color: var(--color-primary-600)"></span>
          <a id="suggestBtn" href="mailto:mathankumar.sh@psgitech.ac.in?subject=Collection%20suggestion%20for%20portfolio" class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-1.5 rounded-xl" style="background: linear-gradient(135deg, var(--gradient-from), var(--gradient-to)); color: #EADCC8">
            <i class="fas fa-lightbulb"></i> Suggest
          </a>
        </div>
      </div>
      <div id="subFilters" class="flex flex-wrap gap-2 mb-5"></div>
      <div id="contentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
      <p id="emptyState" class="text-center py-16 text-sm hidden" style="color: var(--text-muted)">No items in this category.</p>
    </main>
  </div>

  <button id="backToTop" type="button" title="Back to top" aria-label="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">
    <i class="fas fa-arrow-up"></i>
  </button>

  <div id="detailModal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4" onclick="closeDetail()" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="max-w-lg w-full max-h-[90vh] overflow-y-auto rounded-2xl p-5 shadow-2xl" style="background: var(--bg-card)" onclick="event.stopPropagation()">
      <div class="flex justify-between items-start gap-3 mb-3">
        <h3 id="detailTitle" class="font-bold text-lg" style="color: var(--text-main)"></h3>
        <button onclick="closeDetail()" class="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0" style="background: var(--color-primary-50); color: var(--text-main)" aria-label="Close"><i class="fas fa-times" aria-hidden="true"></i></button>
      </div>
      <img id="detailImage" src="" class="w-full max-h-64 object-cover rounded-xl mb-3 hidden" alt="">
      <div id="detailBody" class="text-sm whitespace-pre-wrap leading-relaxed" style="color: var(--text-muted)"></div>
      <a id="detailLink" href="#" target="_blank" rel="noopener noreferrer" class="inline-block mt-4 text-sm font-medium hover:underline" style="color: var(--color-primary-600); display:none">Open link →</a>
    </div>
  </div>

  <script src="collections.js"></script>
  <script>
    function applyTheme(t) {
      document.documentElement.classList.toggle('dark', t === 'dark');
      localStorage.setItem('theme', t);
    }
    function toggleTheme() {
      applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
    }
    (function () {
      const s = localStorage.getItem('theme');
      if (s) applyTheme(s);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches) applyTheme('dark');
    })();
    window.addEventListener('scroll', function () {
      const btn = document.getElementById('backToTop');
      if (!btn) return;
      btn.classList.toggle('show', window.scrollY > 300);
    }, { passive: true });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (typeof closeCatDrawer === 'function') closeCatDrawer();
      if (typeof closeDetail === 'function') closeDetail();
    });
  </script>
</body>
</html>
